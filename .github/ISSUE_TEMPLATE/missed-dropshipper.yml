name: Missed dropshipper
description: DropCheck did not flag a store that dropships.
title: "Missed dropshipper: "
labels: ["missed dropshipper"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Stores that DropCheck misses show which signals it still lacks.
        Please do not post order numbers, addresses or other personal data.

  - type: input
    id: url
    attributes:
      label: Store URL
      placeholder: https://www.example.se/
    validations:
      required: true

  - type: dropdown
    id: verdict
    attributes:
      label: Verdict shown
      options:
        - No dropshipping signals found
        - Mixed signals
        - No shop detected
    validations:
      required: true

  - type: input
    id: score
    attributes:
      label: Score shown
      description: The "Score X of Y" line in the popup.
      placeholder: Score 20 of 125

  - type: textarea
    id: evidence
    attributes:
      label: Why you believe it dropships
      description: >
        What gave it away? For example: the same product sold on AliExpress, Temu or Amazon,
        a return address abroad, long delivery times, a parcel shipped from outside the EU,
        or a report from a consumer agency. Links and screenshots help.
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: Reasons shown in the popup
      description: Copy the listed reasons, if any, or attach a screenshot of the popup.

  - type: input
    id: version
    attributes:
      label: DropCheck version
      description: Shown on chrome://extensions under DropCheck.
      placeholder: "0.8.0"
    validations:
      required: true
