name: release

# Builds the extension zip for a version tag on GitHub's runners, attests where it was
# built, and attaches it to the release. A new tag gets a draft release: write the notes
# on GitHub, then publish. For an existing release, run it by hand with the tag to replace
# its zip with one built here.
#
# Check a downloaded zip with:
#   gh attestation verify dropcheck-X.Y.Z.zip --repo Hinneman/dropcheck
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.5.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Runs the project's dev dependencies (npm ci), so it gets a read-only token.
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # The checks do not use a browser; Puppeteer is only needed for npm run eval.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Pinned to commits (tags can be moved); Renovate keeps them current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: version
        name: Check that the tag matches the manifest version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z"
            exit 1
          fi
          version=$(node -p 'require("./extension/manifest.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The committed extension/ folder, nothing else: the same as Load unpacked.
      - name: Build the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git archive --format=zip -o "dropcheck-$VERSION.zip" HEAD:extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: dropcheck-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # Signs and publishes; runs no project code.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dropcheck-${{ needs.build.outputs.version }}.zip
      - name: Attach the zip to the release
        run: |
          zip="dist/dropcheck-$VERSION.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --draft --verify-tag --title "DropCheck $VERSION" \
              --notes "Write the release notes, then publish this draft."
          fi
