<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Simplified 32 px version of icon.svg, drawn on the pixel grid. -->
  <defs>
    <!-- Cuts a transparent ring around the badge so it stands apart from the box. -->
    <mask id="badge-gap">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="23" cy="23" r="9.5" fill="#000"/>
    </mask>
  </defs>
  <g shape-rendering="crispEdges" mask="url(#badge-gap)">
    <rect x="2" y="4" width="20" height="6" fill="#FCD34D"/>
    <rect x="2" y="10" width="20" height="16" fill="#F59E0B"/>
    <rect x="2" y="10" width="20" height="1" fill="#D97706"/>
    <rect x="11" y="4" width="3" height="9" fill="#B45309"/>
  </g>
  <circle cx="23" cy="23" r="7.5" fill="#16A34A"/>
  <path d="M19 23 22 26 27 21" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
